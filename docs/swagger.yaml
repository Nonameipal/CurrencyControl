host: localhost:8088
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /api/branches:
    get:
      description: Возвращает список всех филиалов для экрана выбора.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.Branch'
            type: array
      summary: Получение списка филиалов
      tags:
      - Branches
  /api/branches/{id}/dashboard:
    get:
      description: Возвращает список компаний с возможностью фильтрации по названию,
        сумме, ИНН и филиалу
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: Название компании
        in: query
        name: company_name
        type: string
      - description: Сумма контракта
        in: query
        name: amount
        type: number
      - description: ИНН компании
        in: query
        name: inn
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DashboardSearchResult'
            type: array
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Поиск для дашборда
      tags:
      - Dashboard
  /api/branches/{id}/dashboard/companies:
    post:
      consumes:
      - application/json
      description: Создает новую компанию (контрагента) с обязательной привязкой к
        филиалу
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: Данные для создания компании
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyRequest'
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Обязательные поля не заполнены
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание новой компании (ҶДММ)
      tags:
      - Companies
  /api/branches/{id}/dashboard/companies/{company_id}:
    put:
      consumes:
      - application/json
      description: Позволяет администратору обновить данные компании (переданные поля
        будут обновлены, пустые - проигнорированы)
      parameters:
      - description: Логин администратора (admin)
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Редактирование компании (ЧДММ)
      tags:
      - Admin
  /api/branches/{id}/dashboard/companies/{company_id}/contracts:
    get:
      description: Возвращает список контрактов для выбранной компании.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Contract'
            type: array
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список контрактов ЧДММ
      tags:
      - Contracts
    post:
      consumes:
      - multipart/form-data
      description: Создает новый контракт
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: Номер контракта
        in: formData
        name: contract_number
        required: true
        type: string
      - description: Название контракта
        in: formData
        name: contract_name
        required: true
        type: string
      - description: Дата контракта (YYYY-MM-DD)
        in: formData
        name: contract_date
        required: true
        type: string
      - description: Дата поставки (YYYY-MM-DD)
        in: formData
        name: delivery_date
        required: true
        type: string
      - description: Дата окончания контракта (YYYY-MM-DD)
        in: formData
        name: contract_end_date
        required: true
        type: string
      - description: Срок поставки (дни)
        in: formData
        name: delivery_term_days
        required: true
        type: integer
      - description: Срок возврата (дни)
        in: formData
        name: return_term_days
        required: true
        type: integer
      - description: Сумма контракта
        in: formData
        name: total_amount
        required: true
        type: number
      - description: Валюта контракта
        in: formData
        name: contract_currency
        required: true
        type: string
      - description: Счет отправителя
        in: formData
        name: sender_account
        required: true
        type: string
      - description: Наименование получателя
        in: formData
        name: receiver_name
        required: true
        type: string
      - description: Счет получателя
        in: formData
        name: receiver_account
        required: true
        type: string
      - description: Страна получателя
        in: formData
        name: receiver_country
        required: true
        type: string
      - description: Предмет
        in: formData
        name: subject
        required: true
        type: string
      - description: Условия поставки
        in: formData
        name: delivery_conditions
        required: true
        type: string
      - description: PDF документ
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Contract'
        "400":
          description: Обязательные поля не заполнены
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание контракта
      tags:
      - Contracts
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}:
    put:
      consumes:
      - multipart/form-data
      description: Позволяет администратору обновить данные контракта
      parameters:
      - description: Логин администратора (admin)
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: Номер контракта
        in: formData
        name: contract_number
        type: string
      - description: Название контракта
        in: formData
        name: contract_name
        type: string
      - description: Дата контракта (YYYY-MM-DD)
        in: formData
        name: contract_date
        type: string
      - description: Дата поставки (YYYY-MM-DD)
        in: formData
        name: delivery_date
        type: string
      - description: Дата окончания контракта (YYYY-MM-DD)
        in: formData
        name: contract_end_date
        type: string
      - description: Срок поставки (дни)
        in: formData
        name: delivery_term_days
        type: integer
      - description: Срок возврата (дни)
        in: formData
        name: return_term_days
        type: integer
      - description: Сумма контракта
        in: formData
        name: total_amount
        type: number
      - description: Валюта контракта
        in: formData
        name: contract_currency
        type: string
      - description: Счет отправителя
        in: formData
        name: sender_account
        type: string
      - description: Наименование получателя
        in: formData
        name: receiver_name
        type: string
      - description: Счет получателя
        in: formData
        name: receiver_account
        type: string
      - description: Страна получателя
        in: formData
        name: receiver_country
        type: string
      - description: Предмет
        in: formData
        name: subject
        type: string
      - description: Условия поставки
        in: formData
        name: delivery_conditions
        type: string
      - description: Новый PDF документ (опционально)
        in: formData
        name: document
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Contract'
        "400":
          description: Некорректный запрос
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Редактирование контракта
      tags:
      - Admin
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/additional-agreements:
    get:
      description: Возвращает список дополнительных соглашений по контракту.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AdditionalAgreement'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Список доп. соглашений контракта
      tags:
      - AdditionalAgreements
    post:
      consumes:
      - multipart/form-data
      description: Создает доп. соглашение к контракту.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: PDF файл доп. соглашения
        in: formData
        name: document
        required: true
        type: file
      - description: Новые условия доставки
        in: formData
        name: delivery_conditions
        type: string
      - description: Новый срок доставки (дней)
        in: formData
        name: delivery_term_days
        type: integer
      - description: Новый срок возврата (дней)
        in: formData
        name: return_term_days
        type: integer
      - description: Предмет соглашения
        in: formData
        name: subject
        type: string
      - description: Продлить срок контракта до (YYYY-MM-DD)
        in: formData
        name: extend_date_to
        type: string
      - description: Сумма в иностранной валюте
        in: formData
        name: foreign_amount
        type: number
      - description: Валюта иностранной суммы (например USD)
        in: formData
        name: foreign_currency
        type: string
      - description: Сумма в валюте контракта (прибавляется к лимиту)
        in: formData
        name: amount_in_contract_currency
        type: number
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AdditionalAgreement'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создать доп. соглашение
      tags:
      - AdditionalAgreements
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/additional-agreements/{agreement_id}:
    put:
      consumes:
      - multipart/form-data
      description: Позволяет администратору обновить данные доп. соглашения
      parameters:
      - description: Логин администратора (admin)
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: ID доп. соглашения
        in: path
        name: agreement_id
        required: true
        type: integer
      - description: Условия поставки
        in: formData
        name: delivery_conditions
        type: string
      - description: Срок поставки
        in: formData
        name: delivery_term_days
        type: integer
      - description: Срок возврата
        in: formData
        name: return_term_days
        type: integer
      - description: Предмет соглашения
        in: formData
        name: subject
        type: string
      - description: Продлить до (YYYY-MM-DD)
        in: formData
        name: extend_date_to
        type: string
      - description: Сумма в валюте (если есть)
        in: formData
        name: foreign_amount
        type: number
      - description: Валюта (если есть)
        in: formData
        name: foreign_currency
        type: string
      - description: Сумма в валюте контракта
        in: formData
        name: amount_in_contract_currency
        type: number
      - description: Новый PDF файл
        in: formData
        name: document
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AdditionalAgreement'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Редактирование доп. соглашения
      tags:
      - Admin
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/invoices:
    get:
      description: Возвращает список инвойсов с ГТД, товарным остатком и PDF документами.
