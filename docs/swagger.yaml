host: localhost:8088
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /api/access-requests:
    get:
      description: 'Возвращает заявки со статусом pending. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AccessRequest'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Список запросов на доступ (ожидающих)
      tags:
      - AccessRequests
  /api/access-requests/{request_id}/approve:
    post:
      description: 'Одобряет заявку и создаёт JWT access/refresh токены. Доступно:
        Комплаенс, Администратор.'
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_service_ports.LoginResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Одобрить запрос на доступ
      tags:
      - AccessRequests
  /api/access-requests/{request_id}/reject:
    post:
      description: 'Отклоняет заявку на доступ. Доступно: Комплаенс, Администратор.'
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Отклонить запрос на доступ
      tags:
      - AccessRequests
  /api/access-requests/history:
    get:
      description: 'Возвращает историю обработанных заявок (только approved и rejected)
        с указанием кто подтвердил или отклонил. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AccessRequest'
            type: array
        "401":
          description: Unauthorized
          schema:
