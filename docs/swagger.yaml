host: localhost:8088
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /admin/access-requests:
    get:
      description: Только для Администратора. Возвращает заявки со статусом pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AccessRequest'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Список запросов на доступ (ожидающих)
      tags:
      - Admin
  /admin/access-requests/{request_id}/approve:
    post:
      description: Только для Администратора. Одобряет заявку, создаёт сессию.
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Session'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Одобрить запрос на доступ
      tags:
      - Admin
  /admin/access-requests/{request_id}/reject:
    post:
      description: Только для Администратора.
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Отклонить запрос на доступ
      tags:
      - Admin
  /admin/branches:
    get:
      description: Возвращает полный список филиалов со всеми метаданными (создатель,
        даты). Доступно только администратору.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Список филиалов
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Создает новый филиал с указанным кодом (ID) и названием. Доступно
        только администратору.
      parameters:
      - description: Код и название филиала
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CreateBranchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректные данные запроса
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Создать филиал
      tags:
      - Admin
  /admin/branches/{branch_id}:
    delete:
      description: Выполняет мягкое удаление филиала. Если к филиалу привязаны пользователи,
        компании или заявки, удаление отклоняется. Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный ID или филиал используется
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Удалить филиал
      tags:
      - Admin
    get:
      description: Возвращает филиал по его коду (ID). Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректный ID
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Получить филиал по ID
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Обновляет название филиала по его ID. Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      - description: Новое название филиала
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.UpdateBranchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Редактировать филиал
      tags:
      - Admin
  /admin/branches/{id}/dashboard/companies/{company_id}:
    delete:
      description: Позволяет администратору удалить карточку клиента (soft delete)
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Удаление карточки клиента
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Позволяет администратору обновить данные карточки клиента
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CompanyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Редактирование карточки клиента
      tags:
      - Admin
  /admin/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}:
    delete:
      consumes:
      - application/json
      description: Позволяет администратору удалить контракт (soft delete)
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удаление контракта
      tags:
      - Admin
    put:
      consumes:
      - multipart/form-data
