      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.AccessRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
