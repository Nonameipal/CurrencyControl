      description: Поиск по справочнику валют.
      parameters:
      - description: Строка для поиска (по названию или коду)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_delivery_http_handlers_counterparty.CurrencyItem'
            type: array
      summary: Поиск валют
      tags:
      - Dictionary
  /api/documents/{entity_type}/{id}/file:
    get:
      description: |-
        маршрут для просмотра и скачивания загруженных файлов.
        По умолчанию файл отдаётся для просмотра (inline) в браузере (например, PDF во встроенном просмотрщике).
        Если указан параметр download=true, файл принудительно скачивается на устройство (attachment).
      parameters:
      - description: Тип сущности (contract, invoice, gtd, additional_agreement, payment_order,
          gtd_extension)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID сущности в базе данных
        in: path
        name: id
        required: true
        type: integer
      - description: Скачать файл (true) вместо просмотра (по умолчанию false)
        in: query
        name: download
        type: boolean
      produces:
      - application/octet-stream
      - application/pdf
      responses:
        "200":
          description: Файл документа
          schema:
            type: file
        "400":
          description: Некорректный ID или тип сущности
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "404":
          description: Документ не найден или файл отсутствует
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Просмотр или скачивание файла документа
      tags:
      - Documents
  /api/my/documents:
    get:
      description: 'Список документов на этапе санкционирования (ГТД, платежные поручения),
        созданных текущим пользователем. Включает все статусы: на проверке, на доработке,
        одобренные, отклонённые.'
      parameters:
      - description: 'Фильтр: mine (только мои, по умолчанию) или all (все документы)'
        in: query
        name: scope
        type: string
      - description: 'Фильтр по статусу: all, pending_currency_control, pending_compliance,
          revision_required, approved, rejected'
        in: query
        name: status
        type: string
      - description: 'Тип документа: all, gtd, payment_order'
        in: query
        name: entity_type
        type: string
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 20, макс 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.MyDocumentsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Мои документы
      tags:
      - MyDocuments
