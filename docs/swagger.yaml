  internal_delivery_http_handlers_workflow.AuditLogsResponse:
    properties:
      limit:
        type: integer
      logs:
        items:
          $ref: '#/definitions/CurrencyControl_internal_domain.AuditLog'
        type: array
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_delivery_http_handlers_workflow.CommonError:
    properties:
      error:
        type: string
    type: object
  internal_delivery_http_handlers_workflow.GrantPermissionRequest:
    properties:
      can_create:
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
      login:
        type: string
    type: object
  internal_delivery_http_handlers_workflow.UpdatePermissionRequest:
    properties:
      can_create:
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
    type: object
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /api/access-requests:
    get:
      description: 'Возвращает заявки со статусом pending. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_domain.AccessRequest'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Список запросов на доступ (ожидающих)
      tags:
      - AccessRequests
  /api/access-requests/{request_id}/approve:
    post:
      description: 'Одобряет заявку и создаёт JWT access/refresh токены. Доступно:
        Комплаенс, Администратор.'
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_service_ports.LoginResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Одобрить запрос на доступ
      tags:
      - AccessRequests
  /api/access-requests/{request_id}/reject:
    post:
      description: 'Отклоняет заявку на доступ. Доступно: Комплаенс, Администратор.'
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Отклонить запрос на доступ
      tags:
      - AccessRequests
  /api/access-requests/history:
    get:
      description: 'Возвращает историю обработанных заявок (только approved и rejected)
        с указанием кто подтвердил или отклонил. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_domain.AccessRequest'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
      security:
      - ApiKeyAuth: []
      summary: История запросов на подтверждение роли и филиала
      tags:
      - AccessRequests
  /api/access-requests/notifications:
    get:
      description: 'Возвращает активные уведомления о пользователях, запросивших доступ
        в систему (статус pending). Пока заявка не подтверждена или не отклонена,
        уведомление не исчезнет. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.AccessRequestNotificationsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_auth.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Уведомления о запросах на вход
      tags:
      - AccessRequests
  /api/approvals/{entity_type}/{id}:
    get:
      description: Возвращает текущий статус двухэтапной проверки документа, историю
        решений и комментарии.
      parameters:
      - description: Тип документа (contract, invoice, gtd, additional_agreement,
          payment_order)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID документа
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ApprovalItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Детальная информация о статусе авторизации документа
      tags:
      - Approvals
  /api/approvals/{entity_type}/{id}/compliance:
    post:
      consumes:
      - application/json
      description: Сотрудник комплаенса может одобрить документ ("approve"), отправить
        на доработку ("revision") или отклонить ("reject"). При одобрении ("approve")
        комментарий не обязателен. При отправке на доработку ("revision") или отклонении
        ("reject") указание причины в комментарии обязательно.
      parameters:
      - description: Тип документа (contract, invoice, gtd, additional_agreement,
          payment_order)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID документа
        in: path
        name: id
        required: true
        type: integer
      - description: Решение комплаенс-контроля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ComplianceDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ApprovalItemResponse'
        "400":
          description: Причина обязательна при отправке на доработку или отклонении
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Проверка документа отделом комплаенс-контроля
      tags:
      - Approvals
  /api/approvals/{entity_type}/{id}/currency-control:
    post:
      consumes:
      - application/json
      description: 'Сотрудник валютного контроля изучает предмет документа и выносит
        одно из трех решений: "accepted" (Принято), "revision" (На доработку), "rejected"
        (Отклонено). При принятии ("accepted") комментарий не обязателен. При "revision"
        и "rejected" комментарий обязателен.'
      parameters:
      - description: Тип документа (contract, invoice, gtd, additional_agreement,
          payment_order)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID документа
        in: path
        name: id
        required: true
        type: integer
      - description: Решение валютного контроля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CurrencyControlDecisionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ApprovalItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Проверка документа отделом валютного контроля
      tags:
      - Approvals
  /api/approvals/accepted:
    get:
      description: Возвращает документы (ГТД и платежные поручения), успешно прошедшие
        оба этапа проверки. Доступно только администратору.
      parameters:
      - description: 'Тип документа: gtd, payment_order'
        in: query
        name: entity_type
        type: string
      - description: ID филиала (для фильтрации)
        in: query
        name: branch_id
        type: integer
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 20, макс 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.AcceptedApprovalsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "403":
          description: Доступ разрешён только администраторам
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Список принятых документов (одобрены и валютным контролем, и комплаенсом)
      tags:
      - Approvals
  /api/approvals/gtd-extensions/{request_id}/compliance:
    post:
      consumes:
      - application/json
      description: 'Сотрудник Комплаенса принимает финальное решение: approve (одобрить
        срок — обновляет дедлайн ГТД) или reject (отклонить).'
      parameters:
      - description: ID заявки на продление
        in: path
        name: request_id
        required: true
        type: integer
      - description: Решение комплаенс-контроля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers_document.complianceExtensionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_domain.GTDExtensionRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Решение Комплаенс-контроля по заявке на увеличение срока ГТД
      tags:
      - Approvals
  /api/approvals/gtd-extensions/{request_id}/currency-control:
    post:
      consumes:
      - application/json
      description: 'Сотрудник Валютного контроля принимает решение: accept (передать
        в комплаенс), revision (отправить на доработку), reject (отклонить).'
      parameters:
      - description: ID заявки на продление
        in: path
        name: request_id
        required: true
        type: integer
      - description: Решение валютного контроля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers_document.currencyControlExtensionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_domain.GTDExtensionRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Решение Валютного контроля по заявке на увеличение срока ГТД
      tags:
      - Approvals
  /api/approvals/gtd-extensions/{request_id}/review:
    post:
      consumes:
      - application/json
      description: Принимает решение по заявке в зависимости от роли (для Валютного
        контроля — accept/revision/reject, для Комплаенса — approve/reject).
      parameters:
      - description: ID заявки на продление
        in: path
        name: request_id
        required: true
        type: integer
      - description: Решение
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http_handlers_document.reviewExtensionBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_domain.GTDExtensionRequest'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_document.CommonError'
