  /api/reports/contracts:
    get:
      description: Формирует аналитический отчет по контрактам, суммам, валютам, инвойсам
        и просрочкам. Для начальника подразделения доступ ограничен его филиалом.
        Для валютного контроля, комплаенса, аудита и админа доступен отчет по любому
        филиалу или сводный отчет.
      parameters:
      - description: ID подразделения (для начальника подразделения игнорируется и
          берется свой филиал)
        in: query
        name: branch_id
        type: integer
      - description: Дата заключения контракта С (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Дата заключения контракта ПО (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - description: Валюта контракта (USD, EUR, TJS, RUB и др.)
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ContractsReportResponse'
        "400":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Формирование отчетности по контрактам и подразделениям
      tags:
      - Reports
