        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/internal_delivery_http_handlers_workflow.CommonError'
