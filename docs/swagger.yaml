      refresh_token_expires_at:
        type: string
      session:
        $ref: '#/definitions/CurrencyControl_internal_domain.Session'
      status:
        $ref: '#/definitions/CurrencyControl_internal_service_ports.LoginStatus'
    type: object
  CurrencyControl_internal_service_ports.LoginStatus:
    enum:
    - active
    - no_role
    type: string
    x-enum-varnames:
