basePath: /
definitions:
  domain.Contract:
    properties:
      additionalAgreement:
        type: string
      branchID:
        type: integer
      clientID:
        type: integer
      contractCurrency:
        type: string
      contractDate:
        type: string
      contractEndDate:
        type: string
      contractName:
        type: string
      contractNumber:
        type: string
      createdAt:
        type: string
      deliveryConditions:
        type: string
      deliveryDate:
        type: string
      deliveryTermDays:
        type: integer
      id:
        type: integer
      receiverAccount:
        type: string
      receiverCountry:
        type: string
      receiverName:
        type: string
      remainingAmount:
        type: number
      returnTermDays:
        type: integer
      senderAccount:
        type: string
      subject:
        type: string
      totalAmount:
        type: number
      updatedAt:
        type: string
    type: object
  domain.Document:
    properties:
      entityID:
        type: integer
      entityType:
        type: string
      filePath:
        type: string
      fileSize:
        type: integer
      id:
        type: integer
      mimeType:
        type: string
      originalName:
        type: string
      uploadedAt:
        type: string
    type: object
  domain.GTD:
    properties:
      created_at:
        type: string
      gtd_amount:
        type: number
      gtd_date:
        type: string
      gtd_number:
        type: string
      id:
        type: integer
      invoice_id:
        type: integer
      updated_at:
        type: string
    type: object
  domain.Invoice:
    properties:
      amount:
        type: number
      contract_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      invoice_date:
        type: string
      invoice_name:
        type: string
      invoice_number:
        type: string
      updated_at:
        type: string
    type: object
  domain.InvoiceWithDetails:
    properties:
      amount:
        type: number
      contract_id:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      document:
        $ref: '#/definitions/domain.Document'
      gtd:
        $ref: '#/definitions/domain.GTD'
      id:
        type: integer
      invoice_date:
        type: string
      invoice_name:
        type: string
      invoice_number:
        type: string
      updated_at:
        type: string
    type: object
  dto.CompanyResponse:
    properties:
      branch_id:
        type: integer
      id:
        type: integer
      inn:
        type: string
      llc:
        type: string
    type: object
  dto.CreateCompanyRequest:
    properties:
      inn:
        type: string
      llc:
        type: string
    type: object
  dto.DashboardSearchResult:
    properties:
      company_id:
        type: integer
      company_name:
        type: string
      inn:
        type: string
      number:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  http.Branch:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  http.Country:
    properties:
      id:
        type: integer
      name_ru:
        type: string
    type: object
  http.Currency:
    properties:
      code:
        type: string
      id:
        type: integer
      name_ru:
        type: string
      numeric_code:
        type: integer
    type: object
host: localhost:8088
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /api/branches:
    get:
      description: Возвращает список всех филиалов для экрана выбора.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.Branch'
            type: array
      summary: Получение списка филиалов
      tags:
      - Branches
  /api/branches/{id}/dashboard:
    get:
      description: Возвращает список компаний с возможностью фильтрации по названию,
        сумме, ИНН и филиалу
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: Название компании
        in: query
        name: company_name
        type: string
      - description: Сумма контракта
        in: query
        name: amount
        type: number
      - description: ИНН компании
        in: query
        name: inn
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DashboardSearchResult'
            type: array
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Поиск для дашборда
      tags:
      - Dashboard
  /api/branches/{id}/dashboard/companies:
    post:
      consumes:
      - application/json
      description: Создает новую компанию (контрагента) с обязательной привязкой к
        филиалу
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: Данные для создания компании
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyRequest'
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CompanyResponse'
        "400":
          description: Обязательные поля не заполнены
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание новой компании (ҶДММ)
      tags:
      - Companies
  /api/branches/{id}/dashboard/companies/{company_id}/contracts:
    get:
      description: Возвращает список контрактов для выбранной компании.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Contract'
            type: array
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить список контрактов ЧДММ
      tags:
      - Contracts
    post:
      consumes:
      - multipart/form-data
      description: Создает новый контракт
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: Номер контракта
        in: formData
        name: contract_number
        required: true
        type: string
      - description: Название контракта
        in: formData
        name: contract_name
        type: string
      - description: Дата контракта (YYYY-MM-DD)
        in: formData
        name: contract_date
        required: true
        type: string
      - description: Дата поставки (YYYY-MM-DD)
        in: formData
        name: delivery_date
        required: true
        type: string
      - description: Дата окончания контракта (YYYY-MM-DD)
        in: formData
        name: contract_end_date
        required: true
        type: string
      - description: Срок поставки (дни)
        in: formData
        name: delivery_term_days
        required: true
        type: integer
      - description: Срок возврата (дни)
        in: formData
        name: return_term_days
        required: true
        type: integer
      - description: Сумма контракта
        in: formData
        name: total_amount
        required: true
        type: number
      - description: Валюта контракта
        in: formData
        name: contract_currency
        required: true
        type: string
      - description: Счет отправителя
        in: formData
        name: sender_account
        required: true
        type: string
      - description: Наименование получателя
        in: formData
        name: receiver_name
        required: true
        type: string
      - description: Счет получателя
        in: formData
        name: receiver_account
        required: true
        type: string
      - description: Страна получателя
        in: formData
        name: receiver_country
        required: true
        type: string
      - description: Предмет
        in: formData
        name: subject
        required: true
        type: string
      - description: Условия поставки
        in: formData
        name: delivery_conditions
        required: true
        type: string
      - description: PDF документ
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Contract'
        "400":
          description: Обязательные поля не заполнены
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создание контракта
      tags:
      - Contracts
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/invoices:
    get:
      description: Возвращает список инвойсов для выбранного контракта с ГТД и документами.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.InvoiceWithDetails'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Список инвойсов контракта
      tags:
      - Invoices
    post:
      consumes:
      - multipart/form-data
      description: Создает инвойс для контракта и загружает PDF документ.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: Номер инвойса
        in: formData
        name: invoice_number
        required: true
        type: string
      - description: Название инвойса
        in: formData
        name: invoice_name
        required: true
        type: string
      - description: Дата инвойса (YYYY-MM-DD)
        in: formData
        name: invoice_date
        required: true
        type: string
      - description: Сумма инвойса
        in: formData
        name: amount
        required: true
        type: number
      - description: Валюта инвойса
        in: formData
        name: currency
        required: true
        type: string
      - description: PDF файл
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Invoice'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создать инвойс
      tags:
      - Invoices
  /api/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/invoices/{invoice_id}/gtd:
    post:
      consumes:
      - multipart/form-data
      description: Добавляет ГТД с файлом к указанному инвойсу.
      parameters:
      - description: Логин пользователя
        in: header
        name: Login
        required: true
        type: string
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: ID инвойса
        in: path
        name: invoice_id
        required: true
        type: integer
      - description: Номер ГТД
        in: formData
        name: gtd_number
        required: true
        type: string
      - description: Сумма ГТД
        in: formData
        name: gtd_amount
        required: true
        type: number
      - description: Дата ГТД (YYYY-MM-DD)
        in: formData
        name: gtd_date
        required: true
        type: string
      - description: PDF файл ГТД
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.GTD'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Добавить ГТД к инвойсу
      tags:
      - Invoices
  /api/countries:
    get:
      description: Поиск по справочнику стран. Можно использовать % для поиска по
        части слова (например, %еспублик%).
      parameters:
      - description: Строка для поиска
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.Country'
            type: array
      summary: Поиск стран
      tags:
      - Dictionary
  /api/currencies:
    get:
      description: Поиск по справочнику валют.
      parameters:
      - description: Строка для поиска (по названию или коду)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/http.Currency'
            type: array
      summary: Поиск валют
      tags:
      - Dictionary
swagger: "2.0"
