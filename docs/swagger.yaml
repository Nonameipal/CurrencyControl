host: localhost:8088
info:
  contact: {}
  description: API сервера для системы валютного контроля.
  title: Currency Control API
  version: "1.0"
paths:
  /admin/access-requests:
    get:
      description: Только для Администратора. Возвращает заявки со статусом pending.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.AccessRequest'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Список запросов на доступ (ожидающих)
      tags:
      - Admin
  /admin/access-requests/{request_id}/approve:
    post:
      description: Только для Администратора. Одобряет заявку, создаёт сессию.
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Session'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Одобрить запрос на доступ
      tags:
      - Admin
  /admin/access-requests/{request_id}/reject:
    post:
      description: Только для Администратора.
      parameters:
      - description: ID заявки
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Отклонить запрос на доступ
      tags:
      - Admin
  /admin/branches:
    get:
      description: Возвращает полный список филиалов со всеми метаданными (создатель,
        даты). Доступно только администратору.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Список филиалов (для администратора)
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Создает новый филиал с указанным кодом (ID) и названием. Доступно
        только администратору.
      parameters:
      - description: Код и название филиала
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CreateBranchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректные данные запроса
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Создать филиал
      tags:
      - Admin
  /admin/branches/{branch_id}:
    delete:
      description: Выполняет мягкое удаление филиала. Если к филиалу привязаны пользователи,
        компании или заявки, удаление отклоняется. Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректный ID или филиал используется
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Удалить филиал
      tags:
      - Admin
    get:
      description: Возвращает филиал по его коду (ID). Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректный ID
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Получить филиал по ID
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Обновляет название филиала по его ID. Доступно только администратору.
      parameters:
      - description: ID филиала
        in: path
        name: branch_id
        required: true
        type: integer
      - description: Новое название филиала
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.UpdateBranchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.BranchResponse'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Филиал не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Редактировать филиал
      tags:
      - Admin
  /admin/branches/{id}/dashboard/companies/{company_id}:
    delete:
      consumes:
      - application/json
      description: Позволяет администратору удалить компанию (soft delete)
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удаление компании
      tags:
      - Admin
    put:
      consumes:
      - application/json
      description: Позволяет администратору обновить данные компании
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.CompanyResponse'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Редактирование компании (ЧДММ)
      tags:
      - Admin
  /admin/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}:
    delete:
      consumes:
      - application/json
      description: Позволяет администратору удалить контракт (soft delete)
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удаление контракта
      tags:
      - Admin
    put:
      consumes:
      - multipart/form-data
      description: Позволяет администратору обновить данные контракта
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании (ЧДММ)
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: Номер контракта
        in: formData
        name: contract_number
        type: string
      - description: Название контракта
        in: formData
        name: contract_name
        type: string
      - description: Дата контракта (YYYY-MM-DD)
        in: formData
        name: contract_date
        type: string
      - description: Дата поставки (YYYY-MM-DD)
        in: formData
        name: delivery_date
        type: string
      - description: Дата окончания контракта (YYYY-MM-DD)
        in: formData
        name: contract_end_date
        type: string
      - description: Срок поставки (дни)
        in: formData
        name: delivery_term_days
        type: integer
      - description: Срок возврата (дни)
        in: formData
        name: return_term_days
        type: integer
      - description: Сумма контракта
        in: formData
        name: total_amount
        type: number
      - description: Валюта контракта
        in: formData
        name: contract_currency
        type: string
      - description: Счет отправителя
        in: formData
        name: sender_account
        type: string
      - description: Наименование получателя
        in: formData
        name: receiver_name
        type: string
      - description: Счет получателя
        in: formData
        name: receiver_account
        type: string
      - description: Страна получателя
        in: formData
        name: receiver_country
        type: string
      - description: Предмет
        in: formData
        name: subject
        type: string
      - description: Условия поставки
        in: formData
        name: delivery_conditions
        type: string
      - description: Новый PDF документ (опционально)
        in: formData
        name: document
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Contract'
        "400":
          description: Некорректный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Редактирование контракта
      tags:
      - Admin
  /admin/branches/{id}/dashboard/companies/{company_id}/contracts/{contract_id}/additional-agreements/{agreement_id}:
    delete:
      consumes:
      - application/json
      description: Позволяет администратору удалить доп. соглашение
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: ID доп. соглашения
        in: path
        name: agreement_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном удалении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удаление доп. соглашения
      tags:
      - Admin
    put:
      consumes:
      - multipart/form-data
      description: Позволяет администратору обновить данные доп. соглашения
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      - description: ID компании
        in: path
        name: company_id
        required: true
        type: integer
      - description: ID контракта
        in: path
        name: contract_id
        required: true
        type: integer
      - description: ID доп. соглашения
        in: path
