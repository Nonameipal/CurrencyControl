        "400":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Выгрузка аналитического отчета в формате Excel (.xlsx)
      tags:
      - Reports
  /api/reports/templates/{report_type}:
    get:
      description: Возвращает файл .xlsx шаблона для просмотра или редактирования.
      parameters:
      - description: 'Вид отчета: contracts, invoices, gtd, additional_agreements,
          clients'
        in: path
        name: report_type
        required: true
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Скачивание текущего Excel-шаблона для отчета
      tags:
      - Reports
    post:
      consumes:
      - multipart/form-data
      description: Позволяет загрузить пользовательский .xlsx шаблон для одного из
        видов отчетов.
      parameters:
      - description: 'Вид отчета: contracts, invoices, gtd, additional_agreements,
          clients'
        in: path
        name: report_type
        required: true
        type: string
      - description: Файл шаблона в формате .xlsx
        in: formData
        name: template
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Загрузка внешнего Excel-шаблона для отчета
      tags:
      - Reports
  /api/reports/types:
    get:
      description: Возвращает список 4 основных видов отчетов (контракты, инвойсы,
        ГТД, доп. соглашения, клиенты)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_delivery_dto.ReportTypeInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Список доступных видов аналитических отчетов
      tags:
      - Reports
  /api/trash:
    get:
      description: Возвращает список всех удаленных документов (контракты, доп. соглашения,
        инвойсы, ГТД). Доступно только сотрудникам Комплаенс и Валютного контроля.
      parameters:
      - description: Фильтр по типу (contract, additional_agreement, invoice, gtd)
        in: query
        name: entity_type
        type: string
      - description: Фильтр по ID филиала
        in: query
        name: branch_id
        type: integer
      - description: Поиск по номеру документа или контрагенту
        in: query
        name: search
        type: string
      - description: Номер страницы (по умолчанию 1)
        in: query
        name: page
        type: integer
      - description: Размер страницы (по умолчанию 20, макс 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.TrashListResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Просмотр корзины удаленных документов
      tags:
      - Trash
  /api/trash/{entity_type}/{id}:
    get:
      description: Возвращает подробную карточку удаленного документа из корзины.
        Доступно только Комплаенс и Валютному контролю.
      parameters:
      - description: Тип сущности (contract, additional_agreement, invoice, gtd)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID записи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_delivery_dto.TrashItem'
        "400":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Документ не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Детальная информация об удаленном документе
      tags:
      - Trash
  /api/trash/{entity_type}/{id}/file:
    get:
      description: Отдает файл удаленного документа (PDF/Word) для просмотра. Доступно
        только Комплаенс и Валютному контролю.
      parameters:
      - description: Тип сущности (contract, additional_agreement, invoice, gtd)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID записи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Файл документа
          schema:
            type: file
        "400":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Файл не найден
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Просмотр или скачивание удаленного файла из корзины
      tags:
      - Trash
  /api/trash/{entity_type}/{id}/restore:
    post:
      description: Восстанавливает удаленный документ обратно в систему. Доступно
        только Комплаенс и Валютному контролю.
      parameters:
      - description: Тип сущности (contract, additional_agreement, invoice, gtd)
        in: path
        name: entity_type
        required: true
        type: string
      - description: ID записи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сообщение об успешном восстановлении
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Некорректные параметры
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Восстановление документа из корзины
      tags:
      - Trash
  /api/users:
    get:
      description: 'Возвращает список всех зарегистрированных пользователей с их ролью
        и филиалом. Доступно: Комплаенс, Администратор.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Список всех пользователей системы
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: 'Создает нового пользователя с указанной ролью и филиалом. Доступно:
        Комплаенс, Администратор.'
      parameters:
      - description: Данные пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Добавить пользователя
      tags:
      - Users
  /api/users/{id}:
    delete:
      description: 'Удаляет пользователя из системы и отзывает все его сессии. Доступно:
        Комплаенс, Администратор.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Удалить пользователя
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: 'Обновляет роль и/или филиал пользователя. Доступно: Комплаенс,
        Администратор.'
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      - description: Новая роль и/или филиал
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Изменить роль и филиал пользователя
      tags:
      - Users
  /auth/access-requests/{request_id}/status:
    get:
      description: Пользователь опрашивает статус своей заявки. Если одобрено — возвращает
        токен сессии.
      parameters:
      - description: ID заявки (из POST /auth/request-access)
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверить статус запроса на доступ
      tags:
      - Auth
  /auth/branches:
    get:
      description: Возвращает список всех существующих филиалов
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Branch'
            type: array
      summary: Список доступных филиалов
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль через AD.
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delivery_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход в систему
      tags:
      - Auth
  /auth/logout:
    post:
      description: Удаляет текущую refresh-сессию пользователя.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход из системы
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Принимает refresh token и возвращает новый access token.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delivery_http.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CurrencyControl_internal_service_ports.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      summary: Обновить access token
      tags:
      - Auth
  /auth/request-access:
    post:
      consumes:
      - application/json
      description: Новый пользователь, прошедший AD-проверку, выбирает свой филиал
        и роль из существующих.
      parameters:
      - description: Выбор филиала и роли (выберите из существующих вариантов)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delivery_http.requestAccessBody'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/delivery_http.AccessRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/delivery_http.CommonError'
      security:
      - ApiKeyAuth: []
      summary: Запрос на доступ (для новых пользователей)
      tags:
      - Auth
  /auth/roles:
    get:
      description: Возвращает список всех существующих ролей
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/delivery_http.RoleInfo'
            type: array
      summary: Список доступных ролей
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    description: Введите Bearer access_token (полученный при /auth/login или /auth/refresh)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
