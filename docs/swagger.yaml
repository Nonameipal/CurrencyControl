      type:
        description: '"gtd_deadline" (Будильник по ГТД) или "contract_expiry" (Срок
          договора)'
        type: string
      unclosed_amount:
        type: number
    type: object
  CurrencyControl_internal_delivery_dto.UpdateBranchRequest:
    properties:
      name:
