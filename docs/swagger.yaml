        in: formData
        name: gtd_number
        required: true
        type: string
      - description: Сумма ГТД (в валюте ГТД)
        in: formData
        name: gtd_amount
        required: true
        type: number
      - description: Валюта ГТД (например EUR)
        in: formData
        name: gtd_currency
        required: true
        type: string
      - description: Дата ГТД (YYYY-MM-DD или DD.MM.YYYY)
        in: formData
        name: gtd_date
        required: true
        type: string
      - description: Сколько закрывается по инвойсу (в валюте инвойса)
        in: formData
        name: closes_amount
        required: true
        type: number
      - description: PDF файл ГТД
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.GTD'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить ГТД к инвойсу
      tags:
      - Invoices
  /api/branches/{id}/dashboard/notifications:
    get:
      description: Возвращает список контрактов, срок действия которых истекает в
        ближайшие 10 дней или уже истек.
      parameters:
      - description: ID филиала
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CurrencyControl_internal_delivery_dto.NotificationResponse'
            type: array
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Уведомления дашборда (контракты с истекающим сроком)
      tags:
      - Dashboard
  /api/countries:
    get:
      description: Поиск по справочнику стран по части названия без учета регистра.
      parameters:
      - description: Строка для поиска
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/delivery_http.Country'
            type: array
      summary: Поиск стран
      tags:
      - Dictionary
  /api/currencies:
    get:
      description: Поиск по справочнику валют.
      parameters:
      - description: Строка для поиска (по названию или коду)
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/delivery_http.Currency'
            type: array
      summary: Поиск валют
      tags:
      - Dictionary
  /auth/access-requests/{request_id}/status:
    get:
      description: Пользователь опрашивает статус своей заявки. Если одобрено — возвращает
        токен сессии.
      parameters:
      - description: ID заявки (из POST /auth/request-access)
        in: path
        name: request_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверить статус запроса на доступ
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин/пароль через AD. Возвращает токен сессии если пользователь
        существует, или статус "no_role" если нужно выбрать филиал и роль.
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delivery_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход в систему
      tags:
      - Auth
  /auth/logout:
    post:
      description: Удаляет текущую сессию пользователя.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход из системы
      tags:
      - Auth
  /auth/request-access:
    post:
      consumes:
      - application/json
      description: Новый пользователь, прошедший AD-проверку, указывает свой филиал
        и роль. Запрос уходит администратору.
      parameters:
      - description: Логин, ID филиала, роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/delivery_http.requestAccessBody'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/domain.AccessRequest'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Запрос на доступ (для новых пользователей)
      tags:
      - Auth
securityDefinitions:
  ApiKeyAuth:
    description: Введите Session-Token (полученный при /auth/login)
    in: header
    name: Session-Token
    type: apiKey
swagger: "2.0"
